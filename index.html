<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HACK MODE</title>
  <style>
    :root {
      --bg: #020b08;
      --panel: rgba(7, 18, 14, 0.9);
      --green: #60ff9a;
      --green2: #00ff66;
      --green3: #b8ffd4;
      --warning: #ffe082;
      --danger: #ff6b6b;
      --shadow: rgba(0, 255, 128, 0.35);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--green);
      font-family: "Courier New", monospace;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at center, rgba(0,255,120,0.09), transparent 40%),
        #010806;
    }

    .terminal {
      width: min(96vw, 1100px);
      height: min(90vh, 700px);
      background: var(--panel);
      border: 2px solid var(--green2);
      box-shadow: 0 0 28px var(--shadow), inset 0 0 22px rgba(0,255,120,0.08);
      padding: 20px 18px 14px;
      position: relative;
      overflow: hidden;
    }

    .header {
      text-align: center;
      font-weight: bold;
      letter-spacing: 2px;
      color: var(--green3);
      text-shadow: 0 0 12px rgba(96,255,154,0.75);
      animation: flicker 1s step-end infinite;
      margin-bottom: 16px;
    }

    @keyframes flicker {
      50% { opacity: 0.6; }
    }

    .screen {
      height: calc(100% - 44px);
      overflow: auto;
      padding-right: 8px;
      font-size: 17px;
      line-height: 1.8;
    }

    .screen::-webkit-scrollbar { width: 8px; }
    .screen::-webkit-scrollbar-thumb {
      background: var(--green2);
      border-radius: 10px;
    }

    .line {
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 26px;
      text-shadow: 0 0 8px rgba(96,255,154,0.45);
    }

    .prompt { color: var(--green); font-weight: bold; }
    .ok { color: var(--green3); }
    .warn { color: var(--warning); }
    .danger { color: var(--danger); }
    .small { color: #b9ffca; }

    .bar {
      width: 100%;
      height: 16px;
      border: 1px solid var(--green2);
      background: rgba(96,255,154,0.08);
      margin: 8px 0;
      overflow: hidden;
    }

    .bar > span {
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, var(--green2), #97ff95);
      box-shadow: 0 0 12px rgba(0,255,102,0.8);
      animation: load 2.5s ease-in-out forwards;
    }

    @keyframes load { from { width: 0; } to { width: 100%; } }

    .cursor {
      display: inline-block;
      width: 10px;
      height: 18px;
      background: var(--green2);
      vertical-align: middle;
      margin-left: 6px;
      animation: blink 0.8s steps(1) infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }

    .note {
      position: absolute;
      left: 18px;
      bottom: 14px;
      border: 1px dashed var(--green2);
      background: rgba(96,255,154,0.06);
      padding: 7px 10px;
      font-size: 12px;
      color: var(--green3);
      box-shadow: 0 0 10px rgba(0,255,128,0.18);
    }
  </style>
</head>
<body>
  <div class="terminal">
    <div class="header">SYSTEM ACCESS // HACK ROUTINE</div>
    <div class="screen" id="screen"></div>
    <div class="note">دحكت عليك يسطا 😂😂</div>
  </div>

  <script>
    const screen = document.getElementById('screen');

    function addLine(text, cls = '') {
      const div = document.createElement('div');
      div.className = 'line ' + cls;
      div.textContent = text;
      screen.appendChild(div);
      screen.scrollTop = screen.scrollHeight;
    }

    function addBar() {
      const wrap = document.createElement('div');
      wrap.className = 'bar';
      const fill = document.createElement('span');
      wrap.appendChild(fill);
      screen.appendChild(wrap);
      screen.scrollTop = screen.scrollHeight;
      return wrap;
    }

    function typeText(text, cls = '', delay = 25) {
      return new Promise(resolve => {
        const line = document.createElement('div');
        line.className = 'line ' + cls;
        screen.appendChild(line);

        let i = 0;
        const tick = () => {
          if (i < text.length) {
            line.textContent = text.slice(0, i + 1);
            i++;
            screen.scrollTop = screen.scrollHeight;
            setTimeout(tick, delay);
          } else {
            const cursor = document.createElement('span');
            cursor.className = 'cursor';
            line.appendChild(cursor);
            resolve();
          }
        };

        tick();
      });
    }

    async function run() {
      await typeText('root@server:~$ whoami', 'prompt', 30);
      await typeText('admin_hacker', 'ok', 30);
      await typeText('root@server:~$ ping target.local', 'prompt', 30);
      await typeText('[+] Connection established', 'ok', 25);
      await typeText('root@server:~$ ./extract_data.sh', 'prompt', 30);
      addLine('[*] Decoding encrypted packets...', 'warn');
      addBar();
      await new Promise(r => setTimeout(r, 2200));
      addLine('[+] 7.2 GB of data copied', 'ok');
      addLine('[+] Firewall bypass complete', 'ok');
      await typeText('root@server:~$ cat /etc/passwd', 'prompt', 30);
      addLine('root:x:0:0:root:/root:/bin/bash', 'small');
      addLine('admin:x:1000:1000:Admin:/home/admin:/bin/bash', 'small');
      addLine('guest:x:1001:1001:Guest:/home/guest:/bin/bash', 'small');
      await typeText('[!!!] SYSTEM COMPROMISED', 'danger', 20);
      await typeText('Final status: fake hack mode activated', 'warn', 25);
      await typeText('الموضوع كله مزحة فقط..', 'ok', 25);
      await typeText('دحكت عليك يسطا 😂😂', 'ok', 30);
    }

    run();
  </script>
</body>
</html>
